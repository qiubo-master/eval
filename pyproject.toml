[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-eval-system"
version = "0.1.0"
description = "Offline evaluation, red teaming, online A/B testing and observability for LLM applications"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "openai>=1.40,<2",
  "langfuse>=3.63,<4",
]

[project.optional-dependencies]
eval = [
  "deepeval>=3,<4",
  "ragas>=0.3,<1",
  "datasets>=3,<5",
  "pandas>=2.2,<3",
]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval_system"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
